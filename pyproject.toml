[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalable-rag-ingestion"
version = "0.1.0"
description = "Asynchronous document ingestion infrastructure for RAG systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "pydantic-settings>=2.2,<3.0",
    "celery[rabbitmq]>=5.3,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "pymupdf>=1.23,<2.0",
    "qdrant-client>=1.8,<2.0",
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6,<6.0"]
ocr = ["pytesseract>=0.3.10,<1.0", "Pillow>=10.0,<13.0"]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.9,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.3,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

